[package]
name = "solcfg"
version = "0.1.0"
edition = "2021"
description = "A TUI for editing the Solana CLI config"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "6"
anyhow = "1"
bs58 = "0.5"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
arboard = "3"
